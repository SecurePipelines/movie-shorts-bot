name: Check YouTube Latest Video

on:
  push:
    branches:
      - fetaure/youtube
  # schedule:
  #   - cron: "0 * * * *"   # every hour
  workflow_dispatch:

jobs:
  check-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python check_youtube.py

      - name: Upload downloaded video
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloads/