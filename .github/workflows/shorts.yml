name: YouTube Shorts Bot

on:
  push:
    branches:
      - feature/test
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3

      - name: 🔐 Create credential files
        run: |
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.TOKEN_JSON }}' > token.json

      - name: ⚙️ Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg python3-pip curl
          pip3 install -r requirements.txt

      - name: ⚙️ Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: 🍪 Create yt-dlp cookies file
        run: |
          if [ -n "${{ secrets.YTDLP_COOKIES }}" ]; then
            echo "${{ secrets.YTDLP_COOKIES }}" > yt_cookies.txt
          fi

      - name: 🚀 Run bot
        run: python3 scripts/main.py
        env:
          YTDLP_COOKIES_FILE: yt_cookies.txt