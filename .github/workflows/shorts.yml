name: Check YouTube Latest Video

on:
  push:
    branches:
      - feature/youtube
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:

jobs:
  check-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: Run script
        id: check
        run: |
          output=$(python check_youtube.py)
          echo "$output"

          echo "$output" >> $GITHUB_ENV

      - name: Trigger next step if video found
        if: env.VIDEO_FOUND == 'true'
        run: |
          echo "New video detected!"
          echo "Title: $TITLE"
          echo "URL: $URL"

          # 👉 call your next script here
          # python generate_shorts.py "$URL"